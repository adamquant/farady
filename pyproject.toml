[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "farady"
dynamic = ["version"]
description = "Islamic Inheritance Distribution Calculator (Faraid)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "SunnaAssets"}
]
keywords = ["inheritance", "islamic", "faraid", "estate-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "mypy"]

[project.scripts]
farady = "farady.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/farady/_version.py"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests_wip", ".venv", "*.egg-info"]
addopts = "-v --tb=short --cov=farady --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "setuptools_scm (>=8.0.0,<9.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "ipython (>=8.0.0,<9.0.0)",
    "jupyter (>=1.0.0,<2.0.0)"
]
