name: Deploy to PyPI

on:
  push:
    branches: [prod-pypi]

permissions:
  contents: write

jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Check if push is from release-pypi merge
      id: check
      run: |
        if [ "${{ github.event.created }}" = "true" ]; then
          echo "Branch was created, allowing..."
          echo "is_valid=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        PARENT_BRANCH=$(git branch -r --contains HEAD^1 2>/dev/null | grep -o 'origin/[^ ]*' | head -1 || echo "")
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        echo "Commit message: $COMMIT_MSG"
        echo "Parent branch: $PARENT_BRANCH"
        
        if echo "$COMMIT_MSG" | grep -q "Merge pull request.*from.*release-pypi"; then
          echo "Valid: PR merge from release-pypi"
          echo "is_valid=true" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "release-pypi"; then
          echo "Valid: Commit references release-pypi"
          echo "is_valid=true" >> $GITHUB_OUTPUT
        else
          echo "WARNING: This push does not appear to be from a release-pypi merge"
          echo "Direct pushes to prod-pypi are discouraged. Use PR from release-pypi."
          echo "is_valid=false" >> $GITHUB_OUTPUT
        fi

  build-and-publish:
    needs: validate-source
    if: needs.validate-source.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.FARADY_RELEASE_TOKEN }}
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry cython numpy
    
    - name: Prepare files for Cython compilation
      run: ./build_pypi.sh
    
    - name: Install dependencies
      run: poetry install --with=dev
    
    - name: Run tests on compiled code
      run: poetry run pytest tests/ -v --ignore=tests/integration/test_lambda_smoke.py
    
    - name: Build with Cython compilation
      run: |
        poetry run python setup.py build_ext --inplace
    
    - name: Build package
      run: poetry build
    
    - name: Publish to PyPI
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        poetry publish --username __token__ --password $PYPI_API_TOKEN
    
    - name: Sync to public repository
      run: |
        # TODO: Implement selective file pushing mechanism to public repository
        echo "Sync to public repository - to be implemented"
    
    - name: Summary
      run: |
        echo "## PyPI Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package published to PyPI successfully**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
        echo "- Verify package on PyPI" >> $GITHUB_STEP_SUMMARY
        echo "- Test installation with 'pip install farady'" >> $GITHUB_STEP_SUMMARY