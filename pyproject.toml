[tool.poetry]
name = "farady"
version = "1.0.0"
description = "Islamic Inheritance Distribution Calculator (Faraid)"
authors = ["SunnaAssets"]
readme = "README.md"
license = "GNU Affero General Public License v3.0"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
packages = [{include = "farady", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
numpy = "^2.4.2"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
numpy = ">=2.4.2,<3.0.0"
pandas = ">=2.0.0,<3.0.0"
ipython = ">=8.0.0,<9.0.0"
jupyter = ">=1.0.0,<2.0.0"
black = ">=25.0.0"
mypy = ">=1.0.0"
coveralls = "^4.0.2"

[tool.poetry.scripts]
farady = "farady.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests_wip", ".venv", "*.egg-info"]
addopts = "-v --tb=short --cov=farady --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
