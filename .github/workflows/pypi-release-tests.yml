name: PyPI Release Tests

on:
  push:
    branches: [release-pypi]
  pull_request:
    branches: [prod-pypi]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run unit tests
      run: pytest tests/ -v --ignore=tests/integration/test_lambda_smoke.py

  cython-compilation-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install cython numpy
    
    - name: Prepare files for Cython compilation
      run: ./build_pypi.sh
    
    - name: Compile with Cython
      run: |
        python setup.py build_ext --inplace
    
    - name: Test compiled code
      run: pytest tests/ -v --ignore=tests/integration/test_lambda_smoke.py